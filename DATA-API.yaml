schemaVersion: "1.0"
# Черновик: точная схема организаторов и публичный HTTPS URL не предоставлены.
status: "draft"

solution:
  name: "ДЕЛО"
  teamId: "replace-before-submission"

api:
  # Не отправлять на проверку до замены фактическим HTTPS URL.
  baseUrl: "https://REPLACE-WITH-ACTUAL-HOST"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "live-health"
    name: "Проверка доступности API"
    description: "Не изменяет данные и подтверждает, что backend отвечает."
    method: "GET"
    path: "/health/live"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
    timeoutMs: 5000
    repeatable: true

  - id: "demo-session"
    name: "Получение demo сессии"
    description: "Только development с DEV_AUTH_ENABLED=true; исключить из production проверки."
    method: "POST"
    path: "/api/v1/auth/demo"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["token", "mode", "expires_at"]
    timeoutMs: 5000
    repeatable: true
